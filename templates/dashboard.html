<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⏳🏢💯 EIGHT.FIVERS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page:            #f9f9f7;
    --surface:         #fcfcfb;
    --text-primary:    #0b0b0b;
    --text-secondary:  #52514e;
    --text-muted:      #898781;
    --border:          rgba(11,11,11,0.10);
    --track:           #e1e0d9;
    --meter:           #2a78d6;
    --good:            #0ca30c;
    --danger:          #d03b3b;
    --cat-0:           #2a78d6; /* blue */
    --cat-1:           #008300; /* green */
    --cat-2:           #e87ba4; /* magenta */
    --cat-3:           #eda100; /* yellow */
    --cat-4:           #1baf7a; /* aqua */
    --cat-5:           #eb6834; /* orange */
    --cat-6:           #4a3aa7; /* violet */
    --cat-7:           #e34948; /* red */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:            #0d0d0d;
      --surface:         #1a1a19;
      --text-primary:    #ffffff;
      --text-secondary:  #c3c2b7;
      --text-muted:      #898781;
      --border:          rgba(255,255,255,0.10);
      --track:           #2c2c2a;
      --meter:           #3987e5;
      --good:            #0ca30c;
      --danger:          #e66767;
      --cat-0:           #3987e5;
      --cat-1:           #008300;
      --cat-2:           #d55181;
      --cat-3:           #c98500;
      --cat-4:           #199e70;
      --cat-5:           #d95926;
      --cat-6:           #9085e9;
      --cat-7:           #e66767;
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    margin: 0;
    padding: 2.5rem 2rem 3rem;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 2rem;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0 0 0.25rem;
  }
  .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin: 0; }

  .edit-toggle {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.85rem;
    cursor: pointer;
  }
  .edit-toggle:hover { color: var(--text-primary); }

  .edit-panel {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
  }
  .edit-form {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 0.6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1rem;
  }
  .edit-form label {
    display: flex;
    flex-direction: column;
    font-size: 0.75rem;
    color: var(--text-muted);
    gap: 0.3rem;
  }
  .edit-form input,
  .edit-form select {
    font: inherit;
    font-size: 0.85rem;
    color: var(--text-primary);
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.55rem;
  }
  .edit-form button {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: #fff;
    background: var(--meter);
    border: none;
    border-radius: 6px;
    padding: 0.45rem 0.9rem;
    cursor: pointer;
  }
  .edit-status { font-size: 0.8rem; color: var(--text-muted); }
  .edit-status.error { color: var(--danger); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem 1.375rem;
  }
  .card.cat-0 { border-color: var(--cat-0); }
  .card.cat-1 { border-color: var(--cat-1); }
  .card.cat-2 { border-color: var(--cat-2); }
  .card.cat-3 { border-color: var(--cat-3); }
  .card.cat-4 { border-color: var(--cat-4); }
  .card.cat-5 { border-color: var(--cat-5); }
  .card.cat-6 { border-color: var(--cat-6); }
  .card.cat-7 { border-color: var(--cat-7); }
  .name {
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.6rem;
  }

  .countdown {
    font-size: 1.75rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .pct {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    margin-top: 0.15rem;
  }

  .meter-track {
    height: 6px;
    border-radius: 3px;
    background: var(--track);
    margin-top: 0.85rem;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    border-radius: 3px;
    background: var(--meter);
    width: 0%;
    transition: width 1s linear;
  }
  .card.done .meter-fill { background: var(--good); }

  .done-panel {
    display: none;
    flex-direction: column;
    gap: 0.15rem;
    color: var(--good);
  }
  .card.done .done-panel { display: flex; }
  .card.done .countdown-wrap { display: none; }

  .clocked {
    font-size: 1.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .clocked-caption {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    opacity: 0.85;
  }
  .farewell {
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 0.5rem;
  }

  .not-checked-in {
    color: var(--text-muted);
    font-size: 0.95rem;
    padding: 0.15rem 0;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>⏳🏢💯 EIGHT.FIVERS</h1>
    <p class="subtitle">{{ joke_of_the_day }}</p>
  </div>

  <div class="edit-panel">
    <div style="display:flex; gap:0.5rem;">
      <a href="/history" class="edit-toggle" style="text-decoration:none;">My past check-ins</a>
      <button type="button" class="edit-toggle" id="edit-toggle">Edit my check-in time</button>
    </div>
    <form class="edit-form" id="edit-form" hidden>
      <label>
        Name
        <select id="edit-name">
          <option value="" disabled selected>Choose your name</option>
          {% for user in users %}
          <option value="{{ user.name }}">{{ user.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Check-in time today
        <input type="time" id="edit-time">
      </label>
      <button type="submit">Save</button>
      <span class="edit-status" id="edit-status"></span>
    </form>
  </div>
</header>

<div class="grid">
  {% for user in users %}
  <div class="card cat-{{ user.color_index }}" data-wake-epoch="{{ user.wake_epoch or '' }}" data-target-epoch="{{ user.target_epoch or '' }}">
    <div class="name">{{ user.name }}</div>
    {% if user.target_epoch is none %}
      <div class="not-checked-in">Not checked in yet</div>
    {% else %}
      <div class="countdown-wrap">
        <div class="countdown">--:--:--</div>
        <div class="pct">-- % done</div>
      </div>
      <div class="done-panel">
        <div class="clocked">--:--:--</div>
        <div class="clocked-caption">&#10003; hours clocked</div>
        <div class="farewell"></div>
      </div>
      <div class="meter-track"><div class="meter-fill"></div></div>
    {% endif %}
  </div>
  {% endfor %}
</div>

<script>
  function formatRemaining(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return [h, m, s].map(n => String(n).padStart(2, "0")).join(":");
  }

  const FAREWELLS = {{ farewells | tojson }};

  function tick() {
    document.querySelectorAll(".card[data-target-epoch]:not([data-target-epoch=''])").forEach(card => {
      const wakeEpoch = parseFloat(card.dataset.wakeEpoch);
      const targetEpoch = parseFloat(card.dataset.targetEpoch);
      const nowSeconds = Date.now() / 1000;
      const remaining = targetEpoch - nowSeconds;
      const fill = card.querySelector(".meter-fill");

      if (remaining <= 0) {
        card.classList.add("done");
        fill.style.width = "100%";

        const clockedSeconds = nowSeconds - wakeEpoch;
        card.querySelector(".clocked").textContent = formatRemaining(clockedSeconds);

        const farewellEl = card.querySelector(".farewell");
        if (!farewellEl.textContent) {
          farewellEl.textContent = FAREWELLS[Math.floor(Math.random() * FAREWELLS.length)];
        }
        return;
      }

      const totalDuration = targetEpoch - wakeEpoch;
      const elapsed = nowSeconds - wakeEpoch;
      const pctDone = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));

      card.querySelector(".countdown").textContent = formatRemaining(remaining);
      card.querySelector(".pct").textContent = `${pctDone.toFixed(0)}% done`;
      fill.style.width = `${pctDone}%`;
    });
  }

  tick();
  setInterval(tick, 1000);

  // --- Edit my check-in time ---
  const editToggle = document.getElementById("edit-toggle");
  const editForm = document.getElementById("edit-form");
  const nameInput = document.getElementById("edit-name");
  const timeInput = document.getElementById("edit-time");
  const statusEl = document.getElementById("edit-status");

  const savedName = localStorage.getItem("worktimer_name");
  if (savedName) nameInput.value = savedName;

  editToggle.addEventListener("click", () => {
    editForm.hidden = !editForm.hidden;
    if (!editForm.hidden && !timeInput.value) {
      const now = new Date();
      timeInput.value = now.toTimeString().slice(0, 5);
    }
  });

  editForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = nameInput.value;
    const time = timeInput.value;
    statusEl.classList.remove("error");

    if (!name || !time) {
      statusEl.textContent = "Choose your name and a time.";
      statusEl.classList.add("error");
      return;
    }
    localStorage.setItem("worktimer_name", name);

    const [hh, mm] = time.split(":").map(Number);
    const wake = new Date();
    wake.setHours(hh, mm, 0, 0);

    statusEl.textContent = "Saving…";
    try {
      const res = await fetch("/checkin/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, wake_time: wake.toISOString() }),
      });
      if (res.ok) {
        statusEl.textContent = "Saved — refreshing…";
        setTimeout(() => location.reload(), 600);
      } else {
        const err = await res.json().catch(() => ({}));
        statusEl.textContent = err.detail || `Error ${res.status}`;
        statusEl.classList.add("error");
      }
    } catch (err) {
      statusEl.textContent = "Network error";
      statusEl.classList.add("error");
    }
  });
</script>
</body>
</html>
